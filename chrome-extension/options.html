<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Home Einstellungen</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="card">
      <h1>Aura Home</h1>
      <p>Lege fest, welche Aura-Home-Adresse im Chrome-Popup geladen wird.</p>
      <label for="auraUrl">Server-URL</label>
      <input id="auraUrl" type="url" inputmode="url" placeholder="http://192.168.55.168:3000/" />
      <div class="row">
        <button id="save" type="button">Speichern</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
